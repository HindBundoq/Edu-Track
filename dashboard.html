<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Page</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Icons (Font Awesome) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body>
    <!-- Layout Container (Fixed Sidebar + Fixed Topbar) -->
    <div id="layout-container"></div>

      <!-- Cohort card (js part) -->
      <div id="cohortCard"></div>

      <!-- Navigation -->
      <nav class="nav" aria-label="Main">
        <ul class="nav-links">
          <li>
            <a href="dashboard.html" class="link is-active" aria-current="page"
              >Dashboard</a
            >
          </li>
          <li><a href="students.html" class="link">Students</a></li>
          <li>
            <a href="track.html" class="link">Tracking &amp; grades</a>
          </li>
          <li>
            <a href="student-profile.html" class="link">At-risk students</a>
          </li>
           <li>
            <a href="attendance.html" class="link">Attendance</a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar Footer -->
      <footer class="sidebar-footer">
        <div class="user">
          <!-- js part -->
          <span class="avatar" id="userAvatar"></span>
          <div>
            <!-- js part -->
            <p class="user-name" id="userName"></p>
            <p class="user-role">Lead Instructor</p>
          </div>
        </div>
        <button class="btn btn-outline btn-block" type="button" id="signOutBtn">
          Sign out
        </button>
      </footer>
    </aside>

    <!-- Overlay (mobile) -->
    <div class="overlay" id="overlay"></div>

    <!-- Main -->
    <div class="main">
      <!-- Page content (js part) -->
      <main class="content" id="content"></main>
    </div>

    <!-- JS Links -->
    <script type="module" src="./js/pages/layout.js"></script>
    <script type="module" src="./js/pages/dashboardPage.js"></script>
  </body>
</html>
