<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking & Grades - Edu-Track</title>
    <!-- Global variables (light + dark) then page styles -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/track.css">
</head>
<body>

    <!-- Main content section for tracking and grading -->
    <main class="main-content">

        <!-- Top header area with title, search, and theme toggle -->
        <header class="top-header">
            <div class="header-title-wrapper">
                <span class="breadcrumb">Cohort 12</span>
                <h1>Tracking & grades</h1>
            </div>

            <div class="header-actions">
                <!-- Search input for filtering the student rows of the selected task -->
                <div class="search-wrapper">
                    <input type="text" id="globalSearch" placeholder="Search students by name or email">
                </div>
                <!-- Light and dark theme toggle buttons -->
                <div class="theme-toggle">
                    <button class="theme-btn active" data-theme="light">Light</button>
                    <button class="theme-btn" data-theme="dark">Dark</button>
                </div>
            </div>
        </header>

        <!-- Subheader: summary stats (filled by trackPage.js) and export button -->
        <section class="subheader-section">
            <p class="stats-summary-text">
                <span id="open"></span>
                <span id="upcoming"></span>
                <span id="closed"></span>
                <span id="needs-grading"></span>
            </p>
            <div class="action-buttons-group">
                <button class="btn-secondary" id="export-btn">Export gradebook (CSV)</button>
            </div>
        </section>

        <!-- Section title -->
        <div class="tabs-nav">
            <span class="tab-item active">Tasks & grading</span>
        </div>

        <!-- Task type filters (counts filled by trackPage.js) -->
        <div class="filter-chips-row" id="task-filters">
            <button class="filter-btn active" data-type="all">All <span id="all-count"></span></button>
            <button class="filter-btn" data-type="assignment">Assignments <span id="assignment-count"></span></button>
            <button class="filter-btn" data-type="quiz">Quizzes <span id="quiz-count"></span></button>
            <button class="filter-btn" data-type="project">Projects <span id="project-count"></span></button>
            <button class="filter-btn" data-type="lab">Labs <span id="lab-count"></span></button>
        </div>

        <!-- Two columns: task cards on the left, selected task details on the right -->
        <div class="tracking-layout">

            <!-- Task cards rendered by trackPage.js -->
            <section class="tasks-list" id="tasks-list"></section>

            <!-- Selected task details + student grading rows rendered by trackPage.js -->
            <section class="task-details" id="task-details">
                <p class="empty-state">Loading tasks...</p>
            </section>

        </div>

    </main>

    <script type="module" src="./js/pages/trackPage.js"></script>
</body>
</html>
