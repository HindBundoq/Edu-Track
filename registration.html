<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/registration.css">

</head>


<body>


    <header class="the-header">

        <h1>🎓 EduTrack</h1>

        <p>Coding Bootcamp</p>

    </header>


    <main>

        <form>

            <section class="form-registration">

                <p>INSTRUCTOR PORTAL</p>

                <h2>Create your account</h2>

                <span>
                    Join EduTrack and manage your students and their progress.
                </span>


                <section class="the-input">


                    <!-- Full Name -->

                    <div>

                        <label for="name">Full Name</label>

                        <br>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <br>


                    <!-- Email -->

                    <div>

                        <label for="email">Email</label>

                        <br>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@edutrack.edu"
                            required>

                    </div>


                    <br>


                    <!-- Password -->

                    <div class="pass-show">

                        <label for="password">Password</label>

                        <br>

                        <input
                            type="password"
                            id="password"
                            placeholder="At least 6 characters"
                            required>

                        <button type="button" id="showpass">
                            Show
                        </button>

                    </div>


                    <br>


                    <!-- Confirm Password -->

                    <div class="pass-show">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <br>

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            required>

                        <button type="button" id="show-confirm-pass">
                            Show
                        </button>

                    </div>


                    <br>


                    <!-- Register -->

                    <a href="index.html" id="register-button">
                        Register
                    </a>


                    <p id="message"></p>


                </section>

            </section>

        </form>

    </main>


    <footer>

        <hr>

        <section class="the-footer">

            <p>EduTrack Instructor Portal</p>

            <p>
                v2026.2.280 © 2026 Glool Platform. All rights
            </p>

        </section>

    </footer>


    <script type="module" src="./js/pages/registrationPage.js"></script>

</body>

</html>
